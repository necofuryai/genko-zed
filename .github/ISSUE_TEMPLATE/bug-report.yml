name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Reports may be written in English or Japanese.
        Use a minimal fictional manuscript. Do not paste unpublished writing, personal information, credentials, or private logs.
  - type: input
    id: version
    attributes:
      label: Genko version
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: zed-version
    attributes:
      label: Zed version
      placeholder: 0.x.y
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: macOS 26 on Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Zed Extension Gallery
        - Dev extension
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: If manuscript content is involved, include the smallest fictional `.genko` example. Otherwise, write N/A and describe the relevant setup or command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove credentials, personal information, paths containing private data, and unpublished writing.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used fictional or redacted data and did not include unpublished writing or sensitive information.
          required: true
