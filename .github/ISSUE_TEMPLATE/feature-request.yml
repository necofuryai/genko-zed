name: Feature request
description: Propose an improvement to Genko.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Requests may be written in English or Japanese.
  - type: textarea
    id: problem
    attributes:
      label: Writing problem
      description: Describe the concrete writing or editing task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what Genko should do from the writer's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds when relevant.
  - type: textarea
    id: example
    attributes:
      label: Fictional example
      description: Use fictional text if an example manuscript is needed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include unpublished writing, personal information, or credentials.
          required: true
