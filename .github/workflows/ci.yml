name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy
          target: wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test extension adapter
        run: cargo test --locked --package genko-zed --lib

      - name: Test language server
        run: cargo test --locked --package genko-ls --all-features

      - name: Build extension WebAssembly
        run: cargo build --locked --release --package genko-zed --target wasm32-wasip2

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Cargo dependency policy
        shell: bash
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/cargo-deny-${CARGO_DENY_VERSION}.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-deny-${CARGO_DENY_VERSION}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --proto '=https' \
            --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"

          printf '%s  %s\n' "${CARGO_DENY_SHA256}" "${archive}" \
            | sha256sum --check --strict

          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 --directory "${install_dir}"

          "${install_dir}/cargo-deny" \
            --workspace \
            --all-features \
            --locked \
            check advisories bans licenses sources

  grammar:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tree-sitter-genko
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: tree-sitter-genko/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: tree-sitter-genko/pnpm-lock.yaml

      - name: Install grammar dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate parser
        run: pnpm run generate

      - name: Verify generated parser is current
        run: git diff --exit-code -- src

      - name: Test grammar
        run: pnpm test

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - rust
      - cargo-deny
      - grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all checks to succeed
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          GRAMMAR_RESULT: ${{ needs.grammar.result }}
        run: |
          set -euo pipefail
          test "${RUST_RESULT}" = "success"
          test "${CARGO_DENY_RESULT}" = "success"
          test "${GRAMMAR_RESULT}" = "success"
