name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match tag to component versions
        id: versions
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          versions = {
              "genko-zed": tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"],
              "genko-ls": tomllib.loads(Path("crates/genko-ls/Cargo.toml").read_text())["package"]["version"],
              "extension": tomllib.loads(Path("extension.toml").read_text())["version"],
          }
          mismatches = {name: version for name, version in versions.items() if version != expected}
          if mismatches or tag != f"v{expected}":
              details = ", ".join(f"{name}={version}" for name, version in versions.items())
              raise SystemExit(f"tag {tag!r} does not match component versions: {details}")

          extension = tomllib.loads(Path("extension.toml").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"grammar_rev={extension['grammars']['genko']['rev']}", file=output)
          PY

      - name: Verify release ancestry
        shell: bash
        env:
          GRAMMAR_REV: ${{ steps.versions.outputs.grammar_rev }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          git merge-base --is-ancestor "${GRAMMAR_REV}" "${GITHUB_SHA}"
          git cat-file -e "${GRAMMAR_REV}:tree-sitter-genko/src/parser.c"

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: genko-ls-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: genko-ls-aarch64-apple-darwin.tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: genko-ls-x86_64-unknown-linux-musl.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: genko-ls-aarch64-unknown-linux-musl.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: genko-ls-x86_64-pc-windows-msvc.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: genko-ls-aarch64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build language server
        run: cargo build --locked --release --package genko-ls --target ${{ matrix.target }}

      - name: Package language server
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="dist/${{ matrix.target }}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/genko-ls" "${staging}/genko-ls"
          tar -C "${staging}" -czf "dist/${{ matrix.archive }}" genko-ls

      - name: Package language server on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "dist/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/genko-ls.exe" "$staging/genko-ls.exe"
          Compress-Archive -Path "$staging/genko-ls.exe" -DestinationPath "dist/${{ matrix.archive }}"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum genko-ls-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
